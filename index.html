<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    
    <!-- Librería de Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <!-- Librería de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <script type="text/javascript">
        (function() {
            emailjs.init({
                publicKey: "dJZcZjuHoASwD1GVP", // Reemplaza esto con tu Public Key de EmailJS
            });
        })();
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .mensaje {
            margin-top: 15px;
            font-weight: bold;
        }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <h2>Contacto</h2>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <!-- Casilla de Google reCAPTCHA -->
        <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6LcLZgIuAAAAAKBkjxON_Gpu0Em8hZMwZMMZrJuu"></div> <!-- Reemplaza esto con tu Site Key de reCAPTCHA -->
        </div>

        <button type="submit" id="submitBtn">Enviar Mensaje</button>
        
        <div id="formMessage" class="mensaje"></div>
    </form>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const statusMessage = document.getElementById('formMessage');
            statusMessage.textContent = "";

            // Validar reCAPTCHA
            const recaptchaResponse = grecaptcha.getResponse();
            if (recaptchaResponse.length === 0) {
                statusMessage.className = "mensaje error";
                statusMessage.textContent = "Por favor, completa el reCAPTCHA para verificar que no eres un robot.";
                return;
            }

            statusMessage.className = "mensaje";
            statusMessage.textContent = "Enviando mensaje...";

            // Enviar con EmailJS
            emailjs.sendForm('service_a33wdks', 'template_7pt0omb', this) // Reemplaza TU_SERVICE_ID y TU_TEMPLATE_ID
                .then(function() {
                    statusMessage.className = "mensaje success";
                    statusMessage.textContent = "¡Mensaje enviado con éxito!";
                    
                    document.getElementById('contactForm').reset();
                    grecaptcha.reset();
                }, function(error) {
                    statusMessage.className = "mensaje error";
                    statusMessage.textContent = "Hubo un error al enviar el mensaje. Inténtalo de nuevo.";
                    console.log('FAILED...', error);
                });
        });
    </script>

</body>
</html>
